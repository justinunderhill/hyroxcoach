[project]
name = "hyrox-coach-api"
version = "0.1.0"
description = "FastAPI backend for HYROX Coach"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.35,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "openai>=1.50,<2",
  "pyjwt[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".next", ".uv-cache", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
